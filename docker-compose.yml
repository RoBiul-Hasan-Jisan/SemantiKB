services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      CORS_ORIGINS: http://localhost:5173
    env_file: [.env]
    volumes: ["./data:/app/data"]
    depends_on: [ollama]
  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: ["ollama:/root/.ollama"]
  frontend:
    image: nginx:alpine
    ports: ["5173:80"]
    volumes: ["./frontend:/usr/share/nginx/html:ro"]
volumes:
  ollama:
